<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mycelium Mesh Node</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f19; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #23314d; padding-bottom: 12px; margin-bottom: 16px; }
        .pill { background: rgba(74,222,128,0.2); color: #4ade80; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .card { background: #151d30; border: 1px solid #23314d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        h2, h3 { color: #38bdf8; margin: 0 0 10px 0; }
        .metric { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .val { color: #38bdf8; font-weight: bold; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-sec { background: transparent; border: 1px solid #23314d; color: #f8fafc; }
        .chat-box { display: flex; flex-direction: column; height: 380px; }
        .messages { flex: 1; overflow-y: auto; background: #020617; border: 1px solid #23314d; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 6px; max-width: 85%; font-size: 14px; word-break: break-word; }
        .msg.user { background: #0284c7; align-self: flex-end; color: #fff; }
        .msg.bot { background: #1e293b; border: 1px solid #23314d; align-self: flex-start; color: #f8fafc; }
        .input-row { display: flex; gap: 8px; }
        input { flex: 1; background: #020617; border: 1px solid #23314d; color: #fff; padding: 10px; border-radius: 6px; outline: none; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🌐 Mycelium Mesh Node</h2>
        <span class="pill">ONLINE</span>
    </div>
    <div class="card">
        <h3>⚙️ SysAdmin Console</h3>
        <div class="metric"><span>LLM Engine</span><span class="val">Qwen2.5 (8080)</span></div>
        <div class="metric"><span>Active Peers</span><span class="val" id="peers">0</span></div>
        <div class="metric"><span>Ledger Height</span><span class="val" id="chain">-</span></div>
        <button class="btn btn-sec" onclick="syncLedger()">⚡ Sync Ledger</button>
    </div>
    <div class="card chat-box">
        <h3>💬 Neural Chat</h3>
        <div class="messages" id="chat">
            <div class="msg bot">Connected to local Qwen2.5 engine on port 8000.</div>
        </div>
        <div class="input-row">
            <input type="text" id="inp" placeholder="Send prompt..." onkeydown="if(event.key==="Enter")send()">
            <button class="btn" style="width:auto; margin:0;" onclick="send()">Send</button>
        </div>
    </div>
    <script>
        const API = "http://localhost:8000";
        async function update() {
            try {
                const res = await fetch(`${API}/status`);
                if(res.ok) {
                    const d = await res.json();
                    document.getElementById("peers").innerText = d.active_peers ?? 0;
                    document.getElementById("chain").innerText = d.chain_length ?? "-";
                }
            }catch(e){}
        }
        setInterval(update, 3000); update();

        async function syncLedger() {
            try {
                const res = await fetch(`${API}/ledger/sync`);
                const d = await res.json();
                alert("Sync: " + JSON.stringify(d));
            }catch(e){alert("Sync failed");}
        }

        async function send() {
            const inp = document.getElementById("inp");
            const txt = inp.value.trim();
            if(!txt) return;
            const chat = document.getElementById("chat");
            chat.innerHTML += `<div class="msg user">${txt}</div>`;
            inp.value = "";
            const bot = document.createElement("div");
            bot.className = "msg bot";
            bot.innerText = "Thinking...";
            chat.appendChild(bot);
            chat.scrollTop = chat.scrollHeight;
            try {
                const res = await fetch(`${API}/prompt`, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({prompt: txt})
                });
                const d = await res.json();
                bot.innerText = d.response || d.output || d.text || JSON.stringify(d);
            }catch(e){
                bot.innerText = "Error querying backend API on port 8000.";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
