services:
  mycelium-node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mycelium-node
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8000:8000"
      - "9999:9999/udp"
    volumes:
      - mycelium_data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: mycelium-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mycelium-node

volumes:
  mycelium_data:
  caddy_data:
  caddy_config:
